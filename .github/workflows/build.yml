name: build

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
    paths-ignore:
      - "landing/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "landing/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for the installers (e.g. 1.1.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write   # needed to publish a GitHub Release on tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore open.sln

      - name: Build
        run: dotnet build open.sln -c Release --no-restore

      - name: Test
        run: dotnet test open.sln -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  package:
    name: Installers
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.TrimStart("v") }
               elseif ("${{ github.event.inputs.version }}") { "${{ github.event.inputs.version }}" }
               else { "1.0.0" }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build apps and suite installer
        shell: pwsh
        run: ./openLauncher/build/build-all.ps1 -Version ${{ steps.version.outputs.value }} -SkipTests

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item openNotes/artifacts/installer/*.exe, openCalendar/artifacts/installer/*.exe, `
                    openKanban/artifacts/installer/*.exe, openLauncher/artifacts/installer/*.exe dist/
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ steps.version.outputs.value }}
          path: dist/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: open* ${{ steps.version.outputs.value }}
          files: dist/*.exe
          generate_release_notes: true
          body: |
            **Telepítés:** a legtöbb esetben az `openSuite-Setup-${{ steps.version.outputs.value }}-x64.exe` kell –
            ebben benne van az openLauncher és mindhárom alkalmazás (telepítéskor választható).
            Az egyes alkalmazások külön telepítői is mellékelve vannak.

            Windows 10 (1809) / 11, x64. .NET nem kell hozzá.
