name: build

# Releases:
#   * Change the VERSION file (e.g. 1.0.0 → 1.1.0) and push to main  → build + GitHub Release "v1.1.0"
#   * Or start a commit message with the version: "v1.1.0 – new features" → same, without touching VERSION
#   * Or push a tag: git tag v1.1.0 && git push origin v1.1.0
# A version that already has a tag is never released twice; other pushes only build and test.

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
    paths-ignore:
      - "landing/**"
  pull_request:
    paths-ignore:
      - "landing/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release for the version in the VERSION file"
        type: boolean
        default: false

permissions:
  contents: write   # create tags and releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are needed to know what was already released

      - id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
          MANUAL_RELEASE: ${{ github.event.inputs.release }}
        run: |
          set -euo pipefail
          shopt -s nocasematch                       # "Release 1.2.0" works too
          file_version="$(tr -d ' \r\n' < VERSION)"
          version="$file_version"
          release=false

          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
            release=true
          elif [[ "$EVENT" == "push" ]]; then
            first_line="$(printf '%s' "$COMMIT_MESSAGE" | head -n1)"
            if [[ "$first_line" =~ ^(release[[:space:]:]+)?v?([0-9]+\.[0-9]+\.[0-9]+)([[:space:]]|$) ]]; then
              version="${BASH_REMATCH[2]}"          # "v1.2.0 ..." or "release: 1.2.0"
              release=true
            elif [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              release=true                           # first push of the branch: release VERSION if new
            elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- VERSION; then
              release=true                           # VERSION file changed in this push
            fi
          elif [[ "$EVENT" == "workflow_dispatch" && "$MANUAL_RELEASE" == "true" ]]; then
            release=true
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version' (expected e.g. 1.2.0)"
            exit 1
          fi

          # Never release the same version twice (except when the tag push itself is the trigger).
          if [[ "$release" == "true" && "$REF_TYPE" != "tag" ]] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::notice::v$version is already released – building without a release."
            release=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "### Version $version – release: $release" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore open.sln

      - name: Build
        run: dotnet build open.sln -c Release --no-restore

      - name: Test
        run: dotnet test open.sln -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  package:
    name: Installers
    needs: [ version, test ]
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build apps and suite installer
        shell: pwsh
        run: ./openLauncher/build/build-all.ps1 -Version $env:VERSION -SkipTests

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item openNotes/artifacts/installer/*.exe, openCalendar/artifacts/installer/*.exe, `
                    openKanban/artifacts/installer/*.exe, openLauncher/artifacts/installer/*.exe dist/
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ env.VERSION }}
          path: dist/*.exe

      - name: Publish GitHub Release
        if: needs.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: open* ${{ env.VERSION }}
          files: dist/*.exe
          generate_release_notes: true
          make_latest: true
          body: |
            **Telepítés:** a legtöbb esetben az `openSuite-Setup-${{ env.VERSION }}-x64.exe` kell –
            ebben benne van az openLauncher és mindhárom alkalmazás (telepítéskor választható).
            Az egyes alkalmazások külön telepítői is mellékelve vannak.

            Windows 10 (1809) / 11, x64. .NET nem kell hozzá.
